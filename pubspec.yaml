name: flutter_meon_kyc
description: "A comprehensive Flutter package for handling Know Your Customer (KYC) processes with automatic permissions, IPV support, payment integration, and complete lifecycle management."
version: 2.0.0
homepage: https://github.com/your-repo/flutter-meon-kyc

environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2
  permission_handler: ^11.0.1
  url_launcher: ^6.2.2
  logger: ^2.0.2+1
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # To add assets to your package, add an assets section, like this:
